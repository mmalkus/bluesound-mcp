[project]
name = "bluesound-mcp"
version = "0.1.0"
description = "MCP server for controlling Bluesound/BluOS players"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2",
    "pyblu>=0.3",
    "aiohttp>=3.9",
]

[project.scripts]
bluesound-mcp = "bluesound_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bluesound_mcp*"]
